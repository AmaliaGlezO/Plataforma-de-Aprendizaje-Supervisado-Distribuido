version: '3.8'

services:
  ray-head:
    build: .
    container_name: ray-head
    ports:
      - "8000:8000"    # API FastAPI
      - "8265:8265"    # Ray Dashboard
      - "8501:8501"    # Streamlit Dashboard (si usas)
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    environment:
      - RAY_DISABLE_IMPORT_WARNING=1
      - PYTHONPATH=/app
      - RAY_HEAD_SERVICE_HOST=0.0.0.0
    command: >
      bash -c "
        echo '🚀 Iniciando Ray Head...' &&
        ray start --head --port=6379 --dashboard-host=0.0.0.0 --dashboard-port=8265 --include-dashboard=true &&
        echo '✅ Ray Head iniciado' &&
        echo '🔧 Iniciando API...' &&
        python app/main.py
      "
    networks:
      - ray-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ray-worker:
    build: .
    depends_on:
      ray-head:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    environment:
      - RAY_DISABLE_IMPORT_WARNING=1
      - PYTHONPATH=/app
    command: >
      bash -c "
        echo '⏳ Esperando Ray Head...' &&
        sleep 15 &&
        echo '🔗 Conectando a Ray Head...' &&
        ray start --address=ray-head:6379 &&
        echo '✅ Worker conectado' &&
        tail -f /dev/null
      "
    networks:
      - ray-network
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    build: .
    container_name: ray-dashboard-app
    ports:
      - "8502:8502"    # Puerto para dashboard personalizado
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - RAY_DISABLE_IMPORT_WARNING=1
      - PYTHONPATH=/app
      - RAY_ADDRESS=ray-head:6379
    command: >
      bash -c "
        echo '⏳ Esperando Ray Head...' &&
        sleep 20 &&
        echo '📊 Iniciando Dashboard personalizado...' &&
        python app/dashboard.py
      "
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      - ray-network

networks:
  ray-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16