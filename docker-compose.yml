services:
  ray-head:
    build: .
    container_name: ray-head
    hostname: ray-head
    ports:
      - "8265:8265"  # Dashboard de Ray
      - "6379:6379"  # Puerto principal de Ray
    networks:
      ray-network:
        ipv4_address: 172.25.0.2
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    shm_size: 2gb
    command: >
      bash -c "ray start --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=2
      --object-manager-port=8076
      --node-manager-port=8077
      --min-worker-port=10002
      --max-worker-port=19999
      --block"
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265"]
      interval: 10s
      timeout: 5s
      retries: 3

  ray-worker1:
    build: .
    container_name: ray-worker1
    hostname: ray-worker1
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      ray-network:
        ipv4_address: 172.25.0.3
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    shm_size: 2gb
    command: >
      bash -c "sleep 20 && ray start
      --address=ray-head:6379
      --num-cpus=2
      --object-manager-port=8076
      --node-manager-port=8077
      --min-worker-port=10002
      --max-worker-port=19999
      --block"
    volumes:
      - ./:/app
    restart: unless-stopped

  ray-worker2:
    build: .
    container_name: ray-worker2
    hostname: ray-worker2
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      ray-network:
        ipv4_address: 172.25.0.4
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    shm_size: 2gb
    command: >
      bash -c "sleep 25 && ray start
      --address=ray-head:6379
      --num-cpus=2
      --object-manager-port=8076
      --node-manager-port=8077
      --min-worker-port=10002
      --max-worker-port=19999
      --block"
    volumes:
      - ./:/app
    restart: unless-stopped

  trainer:
    build: .
    container_name: trainer
    command: tail -f /dev/null  # Mantiene el contenedor activo
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      - ray-network
    volumes:
      - ./:/app
      - models:/app/models
      - data:/app/data
      - training_results:/app/training_results
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1

  ml-api:
    build: .
    container_name: ml-api
    hostname: ml-api
    ports:
      - "8000:8000"  # API FastAPI
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      ray-network:
        ipv4_address: 172.25.0.5
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    volumes:
      - models:/app/models
      - training_results:/app/training_results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      bash -c "sleep 15 && uvicorn api:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: dashboard-app
    hostname: dashboard-app
    ports:
    - "8502:8501"
    depends_on:
      - ray-head
      - ml-api
    networks:
      ray-network:
        ipv4_address: 172.25.0.6
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - API_BASE_URL=http://ml-api:8000
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "sleep 35 && streamlit run Dashboard.py --server.address=0.0.0.0 --server.port=8501"
    volumes:
      - ./:/app
    restart: unless-stopped

networks:
  ray-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

volumes:
  models:
    driver: local
  data:
    driver: local
  training_results:
    driver: local