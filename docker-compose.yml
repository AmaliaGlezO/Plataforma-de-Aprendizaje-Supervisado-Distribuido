services:
  head:
    build: .
    container_name: ray-head
    command: >
      ray start --head --port=6379 --dashboard-host=0.0.0.0
    ports:
      - "8265:8265"   
    networks:
      - ray-net

  worker:
    build: .
    depends_on:
      - head
    command: >
      ray start --address=ray-head:6379
    networks:
      - ray-net

    api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - head
    networks:
      - ray-net


networks:
  ray-net:
    driver: bridge
