version: '3.8'

services:
  ray-head:
    build: .
    container_name: ray-head
    hostname: ray-head
    ports:
      - "8265:8265"
      - "6379:6379"
    networks:
      ray-network:
        ipv4_address: 172.25.0.2
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    shm_size: 2gb
    command: >
      bash -c "ray start --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=2
      --object-manager-port=8076
      --node-manager-port=8077
      --min-worker-port=10002
      --max-worker-port=19999
      --block"
    volumes:
      - ./:/app
    restart: unless-stopped

  ray-worker1:
    build: .
    container_name: ray-worker1
    hostname: ray-worker1
    depends_on:
      ray-head:
        condition: service_started
    networks:
      - ray-network
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    shm_size: 2gb
    command: >
      bash -c "sleep 20 && ray start
      --address=ray-head:6379
      --num-cpus=2
      --object-manager-port=8076
      --node-manager-port=8077
      --min-worker-port=10002
      --max-worker-port=19999
      --block"
    volumes:
      - ./:/app
    restart: unless-stopped

  ray-worker2:
    build: .
    container_name: ray-worker2
    hostname: ray-worker2
    depends_on:
      ray-head:
        condition: service_started
    networks:
      - ray-network
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    shm_size: 2gb
    command: >
      bash -c "sleep 25 && ray start
      --address=ray-head:6379
      --num-cpus=2
      --object-manager-port=8076
      --node-manager-port=8077
      --min-worker-port=10002
      --max-worker-port=19999
      --block"
    volumes:
      - ./:/app
    restart: unless-stopped

  trainer:   
    build: .
    command: python entrenador.py
    depends_on:
      - ray-head
    volumes:
    - ./:/app
    - ./models:/app/models
    - ./data:/app/data
    - ./training_results:/app/training_results  # ✅ esta línea es la que necesitas

  ml-api:
    build: .
    container_name: ml-api
    hostname: ml-api
    ports:
      - "8000:8000"
    depends_on:
      ray-head:
        condition: service_started
    networks:
      - ray-network
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "sleep 30 && uvicorn api:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/app
      - models:/app/models
      - training_results:/app/training_results
    restart: unless-stopped

  dashboard:
    build: .
    container_name: dashboard-app
    hostname: dashboard-app
    ports:
      - "8501:8501"
    depends_on:
      - ray-head
      - ml-api
    networks:
      - ray-network
    environment:
      - RAY_HEAD_SERVICE_HOST=ray-head
      - API_BASE_URL=http://ml-api:8000
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
    command: >
      bash -c "sleep 35 && streamlit run Dashboard.py --server.address=0.0.0.0 --server.port=8501"
    volumes:
      - ./:/app
    restart: unless-stopped

networks:
  ray-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  models:
  training_results:
