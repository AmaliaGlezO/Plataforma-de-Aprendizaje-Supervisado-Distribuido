# Configuración de logging
logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    standard:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    detailed:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s - %(message)s"
      
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: standard
      stream: ext://sys.stdout
      
    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: /app/logs/ml_platform.log
      maxBytes: 10485760  # 10MB
      backupCount: 5
      
    ray_file:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standard
      filename: /app/logs/ray_cluster.log
      maxBytes: 10485760
      backupCount: 3
      
  loggers:
    ray:
      level: INFO
      handlers: [console, ray_file]
      propagate: false
      
    ml_platform:
      level: DEBUG
      handlers: [console, file]
      propagate: false
      
    uvicorn:
      level: INFO
      handlers: [console]
      propagate: false
      
  root:
    level: INFO
    handlers: [console, file]