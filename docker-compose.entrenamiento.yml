version: '3.8'
services:
  ray-head:
    image: rayproject/ray
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0
    ports:
      - "6379:6379"
      - "8265:8265"  # Dashboard
    environment:
      - RAY_ENABLE_WINDOWS_OR_OSX_CLUSTER=1
  
  ray-worker-1:
    image: rayproject/ray
    command: ray start --address=ray-head:6379
    depends_on:
      - ray-head
  
  ray-worker-2:
    image: rayproject/ray
    command: ray start --address=ray-head:6379
    depends_on:
      - ray-head
  
  trainer:
    build: .
    command: python entrenador.py
    depends_on:
      - ray-head
      - ray-worker-1
      - ray-worker-2
    environment:
      - RAY_ADDRESS=ray-head:6379